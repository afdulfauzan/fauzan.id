<!doctype html>
<html lang="{{ site.Language.Name }}" dir="{{ or site.Language.Direction "ltr" }}">
<head>
  {{- partial "head.html" . }}
</head>
<body>
  <a class="skip" href="#main">{{ T "skip_to_content" }}</a>
  {{ partial "header.html" . }}
  <main id="main">
    {{- block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{- if .Store.Get "hasCode" }}
    {{- with resources.Get "js/code.js" | minify | fingerprint }}
  <script src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" data-msg-copy="{{ T "copy" }}" data-msg-copied="{{ T "copied" }}" data-msg-failed="{{ T "copy_failed" }}" defer></script>
    {{- end }}
  {{- end }}
</body>
</html>
