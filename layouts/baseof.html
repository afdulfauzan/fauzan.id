<!doctype html>
<html lang="{{ site.Language.Name }}" dir="{{ or site.Language.Direction "ltr" }}">
<head>
  {{- partial "head.html" . }}
</head>
<body>
  <a class="skip" href="#main">{{ T "skip_to_content" }}</a>
  {{ partial "header.html" . }}
  <main id="main">
    {{- block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{- partial "floating-button.html" . }}
</body>
</html>
