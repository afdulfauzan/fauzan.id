{{ define "main" }}
<header class="wrap page-head">
  <p class="eyebrow">{{ T "tagged" }}</p>
  <h1 class="page-title">#{{ .Title }}</h1>
</header>

<div class="wrap">
  {{- $pager := .Paginator }}
  {{ partial "post-list.html" (dict "pages" $pager.Pages "level" 2 "summary" true) }}
  {{ partial "pager.html" $pager }}
  {{- with .Parent }}
  <p class="more"><a href="{{ .RelPermalink }}">{{ T "all_tags" }} <span aria-hidden="true">→</span></a></p>
  {{- end }}
</div>
{{ end }}
