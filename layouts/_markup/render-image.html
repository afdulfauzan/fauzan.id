{{- /*
  Markdown images → responsive WebP with srcset when the image is a page
  resource (an image in the post's folder) or a global resource (assets/).
  Standalone images become a <figure>, shown smaller than the text column;
  tapping one opens it full screen (assets/js/zoom.js), or opens the image
  file when JavaScript is off. The optional title becomes the caption:
    ![Alt text](photo.jpg "Caption")
*/ -}}
{{- $u := urls.Parse .Destination -}}
{{- $src := $u.String -}}
{{- $srcset := "" -}}
{{- $width := 0 -}}
{{- $height := 0 -}}
{{- $full := $src -}}{{/* the image shown full screen */}}
{{- $fullW := 0 -}}
{{- $fullH := 0 -}}
{{- if not $u.IsAbs -}}
  {{- $path := strings.TrimPrefix "./" $u.Path -}}
  {{- with or (.PageInner.Resources.Get $path) (resources.Get $path) -}}
    {{- $orig := . -}}
    {{- if in (slice "jpeg" "png" "webp") $orig.MediaType.SubType -}}
      {{- $main := $orig -}}
      {{- if gt $orig.Width 1200 -}}
        {{- $main = $orig.Resize "1200x webp q80" -}}
      {{- else -}}
        {{- $main = $orig.Process "webp q80" -}}
      {{- end -}}
      {{- $set := slice -}}
      {{- range slice 480 800 -}}
        {{- if lt . $main.Width -}}
          {{- $r := $orig.Resize (printf "%dx webp q80" .) -}}
          {{- $set = $set | append (printf "%s %dw" $r.RelPermalink $r.Width) -}}
        {{- end -}}
      {{- end -}}
      {{- $set = $set | append (printf "%s %dw" $main.RelPermalink $main.Width) -}}
      {{- $src = $main.RelPermalink -}}
      {{- $srcset = delimit $set ", " -}}
      {{- $width = $main.Width -}}
      {{- $height = $main.Height -}}
      {{- /* full screen: the original size, at most 2400px wide */ -}}
      {{- $big := $main -}}
      {{- if gt $orig.Width 2400 -}}
        {{- $big = $orig.Resize "2400x webp q80" -}}
      {{- else if gt $orig.Width $main.Width -}}
        {{- $big = $orig.Process "webp q80" -}}
      {{- end -}}
      {{- $full = $big.RelPermalink -}}
      {{- $fullW = $big.Width -}}
      {{- $fullH = $big.Height -}}
    {{- else -}}
      {{- $src = $orig.RelPermalink -}}
      {{- $full = $src -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if .IsBlock -}}
{{- .Page.Store.Set "hasZoom" true -}}
{{- /* preview: at most 26rem and 3/4 of the screen wide (see .prose figure img in main.css) */ -}}
<figure>
  <a class="zoom" href="{{ $full }}"{{ with $fullW }} data-w="{{ . }}" data-h="{{ $fullH }}"{{ end }}>
    <img src="{{ $src }}" alt="{{ .PlainText }}"
      {{- with $srcset }} srcset="{{ . }}" sizes="(min-width: 34.7rem) 26rem, 75vw"{{ end }}
      {{- with $width }} width="{{ . }}" height="{{ $height }}" style="--w: {{ . }}px; --r: {{ printf "%.4f" (div (float .) $height) }}"{{ end }} loading="lazy" decoding="async">
    <span class="visually-hidden">{{ T "image_full" }}</span>
  </a>
  {{- with .Title }}
  <figcaption>{{ . }}</figcaption>
  {{- end }}
</figure>
{{- else -}}
<img src="{{ $src }}" alt="{{ .PlainText }}"
  {{- with $srcset }} srcset="{{ . }}" sizes="(min-width: 46rem) 42rem, 100vw"{{ end }}
  {{- with $width }} width="{{ . }}" height="{{ $height }}"{{ end }}
  {{- with .Title }} title="{{ . }}"{{ end }} loading="lazy" decoding="async">
{{- end -}}
{{- /**/ -}}
