<footer class="site-footer">
  <div class="wrap footer-inner">
    <p>© {{ now.Year }} {{ site.Params.author }}</p>
    {{- with where site.Params.social "footer" true }}
    <ul class="footer-links">
      {{- range . }}
      <li><a href="{{ .url }}" rel="me noopener">{{ .name }}</a></li>
      {{- end }}
    </ul>
    {{- end }}
  </div>
</footer>
