# =====================================================================
#  fauzan.id — konfigurasi Hugo
#  Bagian yang perlu diganti ditandai dengan:  # GANTI
# =====================================================================

baseURL = "https://fauzan.id/"
title = "Afdul Fauzan"
timeZone = "Asia/Jakarta"
enableRobotsTXT = true
capitalizeListTitles = false         # tag tetap huruf kecil: #hugo, bukan #Hugo

# Bahasa utama = English (di root: fauzan.id/), Indonesia di fauzan.id/id/
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[pagination]
  pagerSize = 10                     # jumlah catatan per halaman di /notes/ (ID: /id/catatan/)

[taxonomies]
  tag = "tags"                       # hanya pakai tag (tanpa kategori)

[services.rss]
  limit = 20

# Index pencarian per bahasa (/notes/search.json & /id/catatan/search.json), dipakai kotak pencarian di halaman Notes/Catatan
[outputFormats.searchindex]
  mediaType = "application/json"
  baseName = "search"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["html", "rss"]
  section = ["html", "rss", "searchindex"]
  taxonomy = ["html"]
  term = ["html", "rss"]
  page = ["html"]

[markup]
  [markup.goldmark.parser]
    wrapStandAloneImageWithinParagraph = false   # gambar sendirian → <figure>
  [markup.highlight]
    noClasses = false                # warna syntax highlight diatur lewat CSS (monochrome)
    codeFences = true
    guessSyntax = false

# ---------------------------------------------------------------------
#  Data pribadi (dipakai di semua bahasa)
# ---------------------------------------------------------------------
[params]
  author = "Fauzan"                  # GANTI: nama yang ditampilkan
  email = "me@fauzan.id"             # email di halaman Kontak
  monochromeImages = false           # true = gambar di tulisan tampil grayscale

  # Link sosial. contact = true → tampil di halaman Kontak, footer = true → tampil di footer.
  [[params.social]]
    name = "Telegram"
    url = "https://t.me/afdulfauzan"
    handle = "@afdulfauzan"
    contact = true
  [[params.social]]
    name = "GitHub"
    url = "https://github.com/afdulfauzan"
    handle = "@afdulfauzan"
    footer = true
  # [[params.social]]
  #   name = "LinkedIn"
  #   url = "https://www.linkedin.com/in/USERNAME"
  #   handle = "in/USERNAME"
  #   contact = true
  # [[params.social]]
  #   name = "Instagram"
  #   url = "https://www.instagram.com/USERNAME"
  #   handle = "@USERNAME"
  #   contact = true

# ---------------------------------------------------------------------
#  Bahasa
# ---------------------------------------------------------------------
[languages]
  [languages.en]
    label = "English"
    locale = "en-US"
    weight = 1
    [languages.en.params]
      description = "Notes by Afdul Fauzan, IT Support and System Administrator: Linux and everyday IT."  # GANTI
    [[languages.en.menus.main]]
      name = "Home"
      pageRef = "/"
      weight = 10
    [[languages.en.menus.main]]
      name = "Notes"
      pageRef = "/notes"
      weight = 20
    [[languages.en.menus.main]]
      name = "Contact"
      pageRef = "/contact"
      weight = 30

  [languages.id]
    label = "Bahasa Indonesia"
    locale = "id-ID"
    weight = 2
    [languages.id.params]
      description = "Catatan Afdul Fauzan, IT Support dan System Administrator: Linux dan urusan IT sehari-hari."  # GANTI
    [[languages.id.menus.main]]
      name = "Beranda"
      pageRef = "/"
      weight = 10
    [[languages.id.menus.main]]
      name = "Catatan"
      pageRef = "/notes"
      weight = 20
    [[languages.id.menus.main]]
      name = "Kontak"
      pageRef = "/contact"
      weight = 30
    # Catatan versi Indonesia beralamat /id/catatan/… (foldernya tetap content/notes/)
    [languages.id.permalinks.section]
      notes = "/catatan/"
    [languages.id.permalinks.page]
      notes = "/catatan/:slugorcontentbasename/"
